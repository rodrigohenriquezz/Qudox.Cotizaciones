      .qx *,.qx *::before,.qx *::after{box-sizing:border-box;}

      .qx-serif{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:600;letter-spacing:-0.015em;line-height:1.06;}
      .qx-shell{max-width:1180px;margin:0 auto;padding-left:26px;padding-right:26px;width:100%;position:relative;z-index:3;}
      .qx-sec{min-height:100svh;display:flex;align-items:center;padding:104px 0 84px;position:relative;}
      .qx-sec-alto{align-items:flex-start;}
      .qx-sec-gris{background:var(--hueso);}

      .qx-regla{display:flex;height:2px;width:300px;max-width:100%;margin-top:11px;}
      .qx-regla span:first-child{flex:1;background:var(--amarillo);}
      .qx-regla span:last-child{flex:1;background:var(--cian);}
      .qx-eyebrow{font-size:12.5px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--gris);}

      .qx-card{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;}
      .qx-card-gris{background:var(--hueso);border:1px solid var(--linea);border-radius:16px;}
      .qx-pill-verde{background:var(--verde-suave);color:#10331F;font-weight:700;font-size:13.5px;letter-spacing:0.05em;text-transform:uppercase;text-align:center;padding:14px 18px;}
      .qx-pill-gris{background:#E9EBE9;color:#4A4E4B;font-weight:700;font-size:13.5px;letter-spacing:0.05em;text-transform:uppercase;text-align:center;padding:14px 18px;}

      .qx-nota{display:flex;gap:11px;align-items:flex-start;background:#FDEEF0;border:1px solid #F4C3C8;border-radius:12px;padding:15px 17px;font-size:14.5px;line-height:1.55;color:#8C1D28;}
      .qx-aviso{display:flex;gap:11px;align-items:flex-start;background:var(--verde-tenue);border:1px solid #BCE5CC;border-radius:12px;padding:15px 17px;font-size:14.5px;line-height:1.55;color:#17603A;}

      .qx-badge-si,.qx-badge-no{width:20px;height:20px;border-radius:50%;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
      .qx-badge-si{background:var(--verde);} .qx-badge-no{background:var(--rojo);}

      .qx-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:10px;font-family:Manrope,sans-serif;font-size:15px;font-weight:600;padding:14px 24px;cursor:pointer;text-decoration:none;border:1px solid var(--linea);background:var(--blanco);color:var(--carbon);transition:border-color .25s,background .25s,transform .2s;}

      .qx-btn-verde{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:0 10px 26px -14px rgba(52,185,106,.9);}
      .qx-btn-verde:hover{background:#2CA65E;border-color:#2CA65E;transform:translateY(-1px);}

      .qx-tab{border-radius:10px;border:1px solid var(--linea);background:var(--blanco);color:var(--gris);font-size:14px;font-weight:600;padding:11px 20px;cursor:pointer;font-family:Manrope,sans-serif;transition:color .25s,border-color .25s,background .25s;}
      .qx-tab:hover{color:var(--carbon);border-color:#C9CDC9;}
      .qx-tab[data-on="true"]{background:var(--carbon);border-color:var(--carbon);color:#fff;}
      .qx-tab-sm{padding:8px 15px;font-size:13px;}

      .qx-rev{opacity:0;transform:translate3d(0,20px,0);}
      .qx-rev[data-vis="true"]{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);}
      .qx-d1[data-vis="true"]{transition-delay:.08s;} .qx-d2[data-vis="true"]{transition-delay:.16s;} .qx-d3[data-vis="true"]{transition-delay:.24s;}

      /* iPhone 15 Pro Max */
      .qx-iphone-frame{position:relative;border-radius:17.5%/8.6%;padding:2.9%;
        background:linear-gradient(96deg,#5B5B62 0%,#A2A2AB 3%,#74747D 8%,#43434A 26%,#3A3A40 50%,#43434A 74%,#74747D 92%,#A2A2AB 97%,#5B5B62 100%);
        box-shadow:0 18px 40px -20px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.05);}
      .qx-iphone-inner{position:relative;border-radius:15.4%/7.5%;overflow:hidden;background:#000;aspect-ratio:1290/2796;}
      .qx-island{position:absolute;z-index:40;top:1.15%;left:50%;transform:translateX(-50%);width:29%;aspect-ratio:125/36;border-radius:999px;background:#000;display:flex;align-items:center;justify-content:flex-end;padding-right:7%;}

      .qx-btn-lat{position:absolute;border-radius:3px;background:linear-gradient(180deg,#93939D,#4E4E56 40%,#313138);}


      .qx-mini{cursor:pointer;border:none;background:none;padding:0;display:block;width:100%;transition:transform .3s cubic-bezier(.2,.7,.2,1);}
      .qx-mini:hover{transform:translateY(-4px);}
      .qx-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
      .qx-playdot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;width:44px;height:44px;border-radius:50%;
